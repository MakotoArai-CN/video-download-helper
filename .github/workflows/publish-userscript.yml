name: 发布油猴脚本
run-name: 发布油猴脚本 - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-userscript.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-userscript.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-userscript-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRIPT_FILE: dist/video-download-helper.user.js
  SCRIPT_ASSET: video-download-helper.user.js

jobs:
  build:
    name: 编译与发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bunx tsc --noEmit

      - name: 编译油猴脚本
        run: bun run build

      - name: 整理发布信息
        run: |
          test -s "$SCRIPT_FILE"
          grep -q '==UserScript==' "$SCRIPT_FILE"

          version="$(sed -nE 's#^// @version[[:space:]]+(.+)$#\1#p' "$SCRIPT_FILE" | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::未找到 userscript @version 元数据"
            exit 1
          fi

          {
            echo "SCRIPT_VERSION=$version"
            echo "SCRIPT_SHA256=$(sha256sum "$SCRIPT_FILE" | awk '{print $1}')"
            echo "RELEASE_TAG=v$version"
            echo "RELEASE_TITLE=视频下载助手 v$version"
            echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$version"
            echo "INSTALL_URL=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${SCRIPT_ASSET}"
          } >> "$GITHUB_ENV"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: video-download-helper-userscript
          path: ${{ env.SCRIPT_FILE }}
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ${RELEASE_TITLE}"
            echo ""
            echo "- 构建提交: ${GITHUB_SHA}"
            echo "- 安装/更新地址: ${INSTALL_URL}"
          } > release-notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$SCRIPT_FILE" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" "$SCRIPT_FILE" --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          fi

      - name: 检查 Release 发布状态
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-check

          for attempt in 1 2 3 4 5 6; do
            rm -f "release-check/$SCRIPT_ASSET"

            if gh release download "$RELEASE_TAG" --pattern "$SCRIPT_ASSET" --dir release-check --clobber; then
              published_sha="$(sha256sum "release-check/$SCRIPT_ASSET" | awk '{print $1}')"
              if [ "$published_sha" = "$SCRIPT_SHA256" ]; then
                echo "PUBLISH_STATUS=Release 已发布，资产校验通过" >> "$GITHUB_ENV"
                exit 0
              fi
            fi

            echo "等待 Release 资产同步，第 ${attempt} 次重试..."
            sleep 5
          done

          echo "::error::发布校验失败：Release 资产与本次构建产物不一致"
          exit 1

      - name: 写入发布摘要
        if: always()
        run: |
          publish_status="${PUBLISH_STATUS:-PR 仅构建产物，不发布 Release}"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] && [ -z "${PUBLISH_STATUS}" ]; then
            publish_status="Release 发布校验未通过"
          fi

          {
            echo "## 油猴脚本发布"
            echo ""
            echo "| 项目 | 内容 |"
            echo "| --- | --- |"
            echo "| 版本 | ${SCRIPT_VERSION:-未知} |"
            echo "| 构建产物 | \`${SCRIPT_FILE}\` |"
            echo "| Release | ${RELEASE_URL:-仅 push/workflow_dispatch 发布后可用} |"
            echo "| 安装地址 | ${INSTALL_URL:-仅 push/workflow_dispatch 发布后可用} |"
            echo "| 发布状态 | ${publish_status} |"
          } >> "$GITHUB_STEP_SUMMARY"
